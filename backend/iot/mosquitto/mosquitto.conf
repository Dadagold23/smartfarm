# Mosquitto configuration for ASIIS Phase 2 (Module 9) — the REAL device
# channel with spec-mandated encrypted comms + device authentication.
#
# NOT VERIFIED ON THE CURRENT DEV MACHINE: this box has no Docker and no
# mosquitto binary, so these files are documented configuration, and the
# in-process fallback bus (app/iot/bus.py) is the transport actually
# exercised by the test suite. Bring up via docker-compose `mosquitto`
# service on a machine with Docker, then set MQTT_ENABLED=true.
#
# Certificate workflow (example only — generate your own CA, do not ship
# test certs):
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/ca.key -out certs/ca.crt -subj "/CN=ASIIS-CA"
#   ... issue broker + per-device certs signed by that CA into ./certs

listener 1883 127.0.0.1          # plaintext loopback ONLY (local dev)
listener 8883                    # TLS for devices/gateways

certfile   /mosquitto/certs/server.crt
keyfile    /mosquitto/certs/server.key
cafile     /mosquitto/certs/ca.crt
require_certificate false        # set true for mTLS once device certs roll out

# --- Device authentication (spec: "Device authentication", "Encrypted
# --- communication"). Passwords = the device API keys issued by
# --- POST /api/v1/devices; build ./passwd with mosquitto_passwd. Rotating
# --- a key in ASIIS must be followed by `mosquitto_passwd -U` here.
allow_anonymous false
# Create before enabling: mosquitto_passwd -c /mosquitto/passwd <device_code>
# (mosquitto refuses to start when a configured file is missing, so this
# line stays commented until the passwd file is generated):
#password_file /mosquitto/passwd
acl_file      /mosquitto/aclfile

persistence true
persistence_location /mosquitto/data/
